[package]
name = "foundry-price-checker"
version = "0.1.0"
edition = "2021"
description = "Tiny TUI to search, check and sort Azure Foundry model prices"
license = "MIT"
readme = "README.md"
keywords = ["azure", "tui", "pricing", "llm", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "foundry-price-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
csv = "1"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd", "base64", "simdutf8"] }
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
